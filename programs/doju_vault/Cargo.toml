[package]
name = "doju_vault"
version = "0.1.0"
description = "Doju share-token vault: per-mint deposit and withdraw"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "doju_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[dev-dependencies]
solana-program-test = "1.18"
solana-sdk = "1.18"
spl-associated-token-account = "3"
spl-token = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
